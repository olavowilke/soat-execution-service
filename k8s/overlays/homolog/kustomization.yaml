apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: execucao

resources:
  - ../../base

patches:
  - path: patch-recursos.yaml

  - target:
      kind: ConfigMap
      name: execution-service-config
    patch: |-
      - op: add
        path: /data/SPRING_PROFILES_ACTIVE
        value: homolog
      - op: add
        path: /data/ENVIRONMENT
        value: homolog

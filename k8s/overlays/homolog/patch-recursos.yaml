apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: execucao
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: execution-service
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"

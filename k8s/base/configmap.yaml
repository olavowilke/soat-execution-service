apiVersion: v1
kind: ConfigMap
metadata:
  name: execution-service-config
  namespace: execucao
  labels:
    app.kubernetes.io/name: execution-service
    app.kubernetes.io/part-of: oficina
data:
  SERVER_PORT: "8080"
  AWS_REGION: "us-east-1"
  # Nomes das filas (nao URLs): o Spring Cloud AWS resolve o nome em URL.
  EXECUCAO_DYNAMODB_TABELA: "oficina-homolog-execucoes"
  EXECUCAO_FILAS_COMANDOS: "oficina-homolog-execution-commands"
  EXECUCAO_FILAS_COMANDOS_DLQ: "oficina-homolog-execution-commands-dlq"
  EXECUCAO_FILAS_RESPOSTAS: "oficina-homolog-os-saga-replies"
  EXECUCAO_CAPACIDADE_MAXIMA: "20"
  # appName usado pelo New Relic; o painel e os alertas filtram por este nome.
  NEW_RELIC_APP_NAME: "execution-service"

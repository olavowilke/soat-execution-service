# maxUnavailable 1 com uma replica: a drenagem de no nunca fica bloqueada.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: execution-service
  namespace: execucao
  labels:
    app.kubernetes.io/name: execution-service
    app.kubernetes.io/part-of: oficina
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-service

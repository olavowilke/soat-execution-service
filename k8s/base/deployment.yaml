apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: execucao
  labels:
    app.kubernetes.io/name: execution-service
    app.kubernetes.io/part-of: oficina
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-service
        app.kubernetes.io/part-of: oficina
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/scheme: "http"
        prometheus.io/port: "8080"
        prometheus.io/path: "/api/execucao/actuator/prometheus"
    spec:
      serviceAccountName: execution-service
      containers:
        - name: execution-service
          # Placeholder: o CD troca a imagem com `kubectl set image` (sha-<sha>).
          image: execution-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: execution-service-config
          env:
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: execution-service-secrets
                  key: NEW_RELIC_LICENSE_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /api/execucao/actuator/health/readiness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/execucao/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/execucao/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
